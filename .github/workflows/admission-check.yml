name: University admission check

on:
  schedule:
    # GitHub Actions uses UTC. This means every 30 minutes, but scheduled
    # workflows can be delayed when GitHub is busy.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: university-admission-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      CHECK_INTERVAL_MINUTES: "30"
      PLAYWRIGHT_FALLBACK: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Check universities once
        run: python main.py --once

      - name: Save notified.json
        if: always()
        run: |
          git config user.name "admission-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notified.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update admission notification state"
            git push
          fi

      - name: Upload bot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-bot-log
          path: bot.log
          if-no-files-found: ignore
          retention-days: 7
