name: University admission check

on:
  schedule:
    # Every 4 hours (UTC). Scheduled workflows can still be delayed when
    # GitHub is busy.
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: university-admission-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AI_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: google/gemma-4-31b-it:free
      OPENROUTER_FALLBACK_MODEL: openrouter/free
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CHECK_INTERVAL_MINUTES: "240"
      MAX_AI_REQUESTS_PER_RUN: "8"
      PLAYWRIGHT_FALLBACK: "true"

      # Legacy Gemini provider (disabled):
      # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # GEMINI_MODEL: gemini-3.5-flash-lite

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Verify OpenRouter secret
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add OPENROUTER_API_KEY in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Check universities once
        run: python main.py --once

      - name: Save notified.json
        if: always()
        run: |
          git config user.name "admission-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notified.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update admission notification state"
            git push
          fi

      - name: Upload bot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-bot-log
          path: bot.log
          if-no-files-found: ignore
          retention-days: 7
